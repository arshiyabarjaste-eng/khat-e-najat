<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: turquoise (فیروزه‌ای) -->
  <rect width="192" height="192" rx="32" ry="32" fill="#338073"/>

  <!-- Decorative Iranian-style border ring -->
  <rect x="8" y="8" width="176" height="176" rx="24" ry="24"
        fill="none" stroke="#F2D9A8" stroke-width="2" opacity="0.4"/>

  <!-- A curving "life-saving line" — drawn path -->
  <path d="M 24 160 Q 60 80 96 100 T 168 32"
        fill="none"
        stroke="#283380"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Highlight overlay on the line -->
  <path d="M 24 160 Q 60 80 96 100 T 168 32"
        fill="none"
        stroke="#F2D9A8"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.7"/>

  <!-- The "saved" target — a small star at the end of the line -->
  <g transform="translate(168, 32)">
    <circle r="18" fill="#F2C133" stroke="#283380" stroke-width="2"/>
    <path d="M 0,-10 L 3,-3 L 10,-3 L 4.5,1 L 7,8 L 0,4 L -7,8 L -4.5,1 L -10,-3 L -3,-3 Z"
          fill="#283380"/>
  </g>

  <!-- Source point — small dot -->
  <circle cx="24" cy="160" r="6" fill="#283380"/>
</svg>
